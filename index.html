<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Treino Home Pro - Treinador Pessoal Inteligente</title>
    <meta name="description" content="Seu treinador pessoal para treinos em casa com controle de progresso, gamificação e calistenia." />
    <meta name="theme-color" content="#7ab81e" />
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var origFetch = window.fetch;
            if (typeof origFetch === 'function') {
              var customFetch = function(input, init) {
                return origFetch.call(window, input, init);
              };
              try {
                Object.defineProperty(window, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  writable: true,
                  value: customFetch
                });
              } catch (err1) {
                try {
                  Object.defineProperty(window, 'fetch', {
                    configurable: true,
                    enumerable: true,
                    get: function() { return customFetch; },
                    set: function(newFetch) { customFetch = newFetch; }
                  });
                } catch (err2) {}
              }
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-lime-400 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
